<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
            font-size: 14px;
        }

        .upload-box {
            border: 2px dashed #ccc;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            background-color: #fafafa;
        }

        .upload-box input {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Profile</h1>

        <!-- Space to add info -->
        <div class="section">
            <label for="about">About Me</label>
            <textarea id="about" placeholder="Type your info here..."></textarea>
        </div>

        <!-- First PDF Upload Block -->
        <div class="section">
            <label>Upload PDF 1</label>
            <div class="upload-box">
                <input type="file" accept=".pdf">
            </div>
        </div>

        <!-- Second PDF Upload Block -->
        <div class="section">
            <label>Upload PDF 2</label>
            <div class="upload-box">
                <input type="file" accept=".pdf">
            </div>
        </div>

    </div>

</body>
</html>
